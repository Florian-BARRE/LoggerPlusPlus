# Orca: what it does for each new worktree of loggerplusplus.
# The setup installs the Poetry env (as [checks].deps does) and puts the kit's git hooks back.
# It always succeeds: a failed setup would leave the worktree without its agent.
setupAgentStartupPolicy: wait-for-setup
scripts:
  setup: |
    uvx --from 'poetry>=2,<3' poetry install --no-interaction || true
    aidk stack setup || true
