# AI Dev Kit: what aidk verify checks before a task is declared done (agents and the Stop hook).
# Each check is the command as a list of arguments, run from the repository root, in this order.
# The CI gate's commands (.github/workflows/quality.yml and ci.yml), through uv (no Poetry needed).
# CI controls with no [checks] entry, on purpose:
# - quality.yml test job's matrix (Python 3.9 to 3.13 on Linux, macOS and Windows): one local
#   interpreter here, so `tests` runs once; the matrix in CI is the real guard of the 3.9 floor
#   and of the other OSes.
# - quality.yml build job's upload-artifact step: CI plumbing, nothing to check locally.
# - ci.yml secrets job, gitleaks scan of the new commits: gitleaks is not installed on the dev
#   machines; [hooks] secrets = true scans each commit for secrets instead, and the CI job still
#   runs on every request.
# - ci.yml all-green: an aggregate of quality and secrets, nothing of its own.
# - codeql.yml: GitHub's CodeQL analysis, runs only on GitHub (results in the Security tab).
# - aidk-checks.yml: the kit's drift rules, which aidk verify and aidk done already replay ([rules]).
# - publish.yml and release-please.yml: the release flow (Florian-BARRE's), not a check of a request.

[project]
kind = "code"    # code, docs or research: docs and research need no tests rule, their checks are optional

[checks]
# uv sync installs both project and [dependency-groups.dev] in one command.
deps = ["uv", "sync", "--frozen"]
# quality.yml lint job.
format = ["uv", "run", "black", "--check", "src/", "tests/", "examples/"]
lint = ["uv", "run", "ruff", "check", "src/", "tests/", "examples/"]
types = ["uv", "run", "mypy", "src/"]
# quality.yml test job, on the local interpreter only (see the matrix above).
tests = ["uv", "run", "pytest", "--cov=loggerplusplus", "--cov-report=term-missing", "--cov-fail-under=95"]
# quality.yml build job: uv build (into dist/, gitignored, emptied first), twine check, then
# the wheel installed in a clean venv of a temporary directory and imported.
build = ["bash", "-euo", "pipefail", "-c", '''
rm -rf dist
uvx twine check dist/* 2>/dev/null || true
uv build
uvx twine check dist/*
smoke="$(mktemp -d)"
trap 'rm -rf "$smoke"' EXIT
python3 -m venv "$smoke/venv"
"$smoke/venv/bin/pip" install --quiet dist/*.whl
"$smoke/venv/bin/python" -c "import loggerplusplus; print('import OK', loggerplusplus.__version__)"
''']
# ci.yml secrets job, its "Reject tracked secret-looking files" step (same patterns).
secrets = ["bash", "-euo", "pipefail", "-c", '''
offenders=()
while IFS= read -r -d '' path; do
  name="${path##*/}"
  case "$name" in
    *.example) continue ;;
    .env|.env.*|*.pem|*.key|*.p12|*.pfx|id_rsa*|id_ed25519*|.pypirc|credentials*.json|secrets*.yml|secrets*.yaml)
      offenders+=("$path") ;;
  esac
done < <(git ls-files -z)
if [ "${#offenders[@]}" -gt 0 ]; then
  printf 'Secret-looking files are tracked by git:\n'
  printf '  %s\n' "${offenders[@]}"
  exit 1
fi
echo "No secret-looking files tracked."
''']

[rules]
base = "origin/main"
# A change to source files needs a change to test files (globs, relative to the repository).
# Only the package is source: examples/ are runnable docs that tests/test_examples.py already runs (a changed
# example is exercised by the existing test, it needs no new one).
# Neither is a test either: a change there must not count as the test of a change to src/.
source = ["src/**"]
tests = ["tests/**"]
require_tests = true
timeout = 900    # seconds, per check

# The kit's git hooks (every commit and every push, whatever the agent's tool): the names of [checks]
# run at each commit (keep them fast: a few seconds) and before each push.
# deps, build and secrets stay out: deps is what the others need once (Orca's worktree setup runs it), build
# rebuilds the package, and the commit hook's own secret scan (secrets = true) covers secrets.
[hooks]
pre_commit = ["format", "lint"]    # about 0.4 s each once the uv env exists (measured)
pre_push = ["types", "tests"]      # about 0.4 s + 19 s (measured)
commit_format = "conventional"
secrets = true

# No [stack]: a library, no dev server. No [index]: the kit's defaults. No [ci]: aidk-checks runs on
# GitHub's ubuntu-latest (a public repository: never a self-hosted runner).

# Never merged without Florian-BARRE: the publication pipeline, release-please and the dependencies.
[merge]
never_alone = [
    ".github/workflows/**",
    ".github/dependabot.yml",
    "release-please-config.json",
    ".release-please-manifest.json",
    "pyproject.toml",
    "uv.lock",
]
# The dependency bots whose requests the kit reviews without a task (their login on the forge; never_alone holds).
bots = ["dependabot[bot]"]
